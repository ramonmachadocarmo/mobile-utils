name: Android

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

env:
  FLUTTER_VERSION: 3.41.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze + test
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: play-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Upload keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      # versionName vem da tag (v1.2.3 -> 1.2.3; manual usa o pubspec). O versionCode
      # é (número da execução + offset), sempre crescente. O offset fica acima do
      # último upload manual (1000); aumente-o se a Play recusar por já existir um
      # versionCode maior.
      - name: Build app bundle
        env:
          VERSION_CODE_OFFSET: 1000
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          else
            BUILD_NAME="$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')"
          fi
          flutter pub get
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number=$(( GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET ))

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ramonmachadocarmo.mobileUtils
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
